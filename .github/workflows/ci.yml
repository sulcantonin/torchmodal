name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -q --cov=torchmodal --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          line = float(r.get("line-rate", 0)) * 100
          branch = float(r.get("branch-rate", 0)) * 100
          print(f"## Coverage\n\n- Line: **{line:.1f}%**\n- Branch: **{branch:.1f}%**")
          PY
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check torchmodal/ tests/
      - name: mypy
        # No `|| true`. The package type-checks clean as of 0.8.0 and this
        # gate is what keeps it that way.
        run: mypy torchmodal/

  examples:
    name: examples smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install matplotlib networkx scikit-learn
      - name: Run every example
        env:
          MPLBACKEND: Agg
          MLNN_COLOR_SMOKE: "1"
          MLNN_SUDOKU_SMOKE: "1"
        run: python scripts/run_examples.py

  notebooks:
    name: notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbclient nbformat ipykernel matplotlib scikit-learn networkx
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: python scripts/run_notebooks.py

  citation:
    name: CITATION.cff validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cffconvert
      - run: |
          python - <<'PY'
          from cffconvert import Citation
          Citation(open("CITATION.cff").read()).validate()
          print("CITATION.cff is valid")
          PY
