site_name: torchmodal
site_description: >-
  Differentiable modal logic for PyTorch: sound interval bounds and a learnable
  Kripke accessibility relation.
site_url: https://sulcantonin.github.io/torchmodal/
repo_url: https://github.com/sulcantonin/torchmodal
repo_name: sulcantonin/torchmodal
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Limitations: limitations.md
  - Examples: examples.md
  - API reference:
      - functional: api/functional.md
      - diagnostics: api/diagnostics.md
      - epistemic: api/epistemic.md
      - fixpoint: api/fixpoint.md
      - nn: api/nn.md
      - kripke: api/kripke.md
      - inference: api/inference.md
      - losses: api/losses.md
      - systems: api/systems.md
      - utils: api/utils.md
