<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="torchmodal">
  <defs>
    <linearGradient id="core" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C2361F"/><stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
  </defs>
  <!-- outlined diamond = possibility / upper bound U; solid square = necessity / lower bound L.
       The square sits inside the diamond: □φ ≤ ♢φ, and the gap between them is the interval. -->
  <path d="M100 12 L188 100 L100 188 L12 100 Z" fill="#E8492F" fill-opacity="0.14"
        stroke="#E8492F" stroke-width="9" stroke-linejoin="round"/>
  <rect x="64" y="64" width="72" height="72" rx="7" fill="url(#core)"/>
</svg>
