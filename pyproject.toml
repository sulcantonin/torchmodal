[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchmodal"
version = "0.8.0"
description = "Differentiable modal logic for PyTorch: sound interval bounds and a learnable Kripke accessibility relation (Modal Logic Neural Networks)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Antonin Sulc", email = "sulc.antonin@gmail.com"},
]
keywords = [
    "neurosymbolic",
    "modal-logic",
    "kripke-semantics",
    "differentiable-logic",
    "differentiable-reasoning",
    "epistemic-logic",
    "temporal-logic",
    "fuzzy-logic",
    "neural-symbolic",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/sulcantonin/torchmodal"
Documentation = "https://sulcantonin.github.io/torchmodal/"
Paper = "https://openreview.net/pdf?id=uLOdtBm0Cx"
Source = "https://github.com/sulcantonin/torchmodal"
Repository = "https://github.com/sulcantonin/torchmodal"
Issues = "https://github.com/sulcantonin/torchmodal/issues"
Changelog = "https://github.com/sulcantonin/torchmodal/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["torchmodal*"]

[tool.setuptools.package-data]
torchmodal = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
# The package type-checks clean as of 0.8.0. These keep it that way: a new
# ignore has to be justified, and a stale one is an error rather than debt.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# torch ships partial stubs; its untyped internals are not ours to annotate.
module = ["torch.*"]
follow_imports = "skip"

[tool.coverage.run]
source = ["torchmodal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
