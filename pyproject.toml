[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchmodal"
version = "0.2.1"
description = "Differentiable Modal Logic for PyTorch — Modal Logical Neural Networks (MLNNs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Antonin Sulc", email = "sulc.antonin@gmail.com"},
]
keywords = [
    "modal-logic",
    "neurosymbolic",
    "kripke-semantics",
    "differentiable-reasoning",
    "epistemic-logic",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/sulcantonin/torchmodal"
Documentation = "https://github.com/sulcantonin/torchmodal#readme"
Repository = "https://github.com/sulcantonin/torchmodal"
Issues = "https://github.com/sulcantonin/torchmodal/issues"
Changelog = "https://github.com/sulcantonin/torchmodal/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["torchmodal*"]

[tool.setuptools.package-data]
torchmodal = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
